name: cleanup-temp

on:
  push:
    paths:
      - .github/workflows/cleanup-temp.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temp files
        run: |
          set -e
          git rm -f hotfix-status.txt || true
          git rm -f .github/workflows/cleanup-temp.yml
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add -A
          git commit -m "清理临时文件"
          git push

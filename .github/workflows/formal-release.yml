name: formal-release

# 正式发布入口：仅允许从 main 手动触发。
# 验证工作与真正创建 Release 的写权限分离。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 5.6.0 或 5.6.0-rc.1（不带 v）"
        required: true
        default: "5.5.0"
        type: string
      channel:
        description: "发布渠道"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      mode:
        description: "dry-run 只检查不发布；publish 才创建版本标签和 Release"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

# 默认不给工作流授予任何 GITHUB_TOKEN 权限。
permissions: {}

concurrency:
  group: formal-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release input and changelog
        id: release
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          case "$CHANNEL" in
            stable|prerelease) ;;
            *)
              echo "发布渠道无效：$CHANNEL"
              exit 1
              ;;
          esac

          case "$MODE" in
            dry-run|publish) ;;
            *)
              echo "发布模式无效：$MODE"
              exit 1
              ;;
          esac

          # SemVer numeric identifiers must not contain leading zeroes.
          # This project intentionally allows only alpha.N, beta.N, and rc.N prereleases.
          VERSION_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\.(0|[1-9][0-9]*)))?$'
          if [[ ! "$VERSION" =~ $VERSION_REGEX ]]; then
            echo "版本号格式不正确：$VERSION"
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && "$VERSION" == *-* ]]; then
            echo "Stable 正式版不能带 alpha/beta/rc 后缀"
            exit 1
          fi
          if [[ "$CHANNEL" == "prerelease" && "$VERSION" != *-* ]]; then
            echo "预发布版本必须带 alpha/beta/rc 后缀"
            exit 1
          fi

          TAG="v$VERSION"
          if ! TAG_REFS=$(git ls-remote --tags origin "refs/tags/$TAG"); then
            echo "无法确认远程版本标签状态，拒绝继续发布：$TAG"
            exit 1
          fi
          if [[ -n "$TAG_REFS" ]]; then
            echo "版本标签已存在：$TAG"
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 {
              rest = substr($0, length(heading) + 1)
              if (rest == "" || rest ~ /^[[:space:]]/) {
                found = 1
                next
              }
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "CHANGELOG 对应版本章节为空，拒绝发布"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Static code audit
        run: node .github/scripts/code_audit.js

      - name: Cat game migration security audit
        run: node .github/scripts/cat_game_migration_check.js

      - name: Cat game work-order behaviour check
        run: node .github/scripts/cat_work_order_check.js

      - name: Cat game database behaviour checks (local PGlite only)
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund @electric-sql/pglite@0.6.0
          node .github/scripts/cat_game_pg_check.mjs .

      - name: Timer regression tests
        run: node .github/scripts/timer_check.js v5.5.html

      - name: Wait for successful GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "等待当前提交对应的 GitHub Pages 部署成功：$GITHUB_SHA"

          for attempt in $(seq 1 30); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" > "$RUNNER_TEMP/pages-runs.json"
            MATCH=$(jq -c --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .name == "pages build and deployment")] | first // empty' "$RUNNER_TEMP/pages-runs.json")

            if [[ -n "$MATCH" ]]; then
              STATUS=$(jq -r '.status' <<< "$MATCH")
              CONCLUSION=$(jq -r '.conclusion // ""' <<< "$MATCH")
              URL=$(jq -r '.html_url' <<< "$MATCH")
              echo "Pages 状态：$STATUS / $CONCLUSION"
              if [[ "$STATUS" == "completed" && "$CONCLUSION" == "success" ]]; then
                echo "网页部署已成功：$URL"
                exit 0
              fi
              if [[ "$STATUS" == "completed" && "$CONCLUSION" != "success" ]]; then
                echo "网页部署失败，拒绝创建正式版本：$URL"
                exit 1
              fi
            else
              echo "尚未找到当前提交对应的 Pages 部署记录。"
            fi

            if [[ "$attempt" -lt 30 ]]; then
              sleep 20
            fi
          done

          echo "等待 10 分钟仍未确认网页部署成功，拒绝创建正式版本。"
          exit 1

      - name: Upload release notes for publish job
        if: inputs.mode == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ steps.release.outputs.notes_file }}
          if-no-files-found: error
          retention-days: 1

      - name: Verification summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "## 发布前验证完成"
            echo
            echo "- 版本：$TAG"
            echo "- 渠道：$CHANNEL"
            echo "- 模式：$MODE"
            echo "- 代码：$GITHUB_SHA"
            echo "- 代码审计与计时测试：通过"
            echo "- GitHub Pages 部署：成功"
            if [[ "$MODE" == "dry-run" ]]; then
              echo
              echo "这是安全演练：未创建 Git 标签，也未创建 GitHub Release。"
            else
              echo
              echo "验证已通过，发布任务将使用独立的 contents:write 权限。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          ARGS=("$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "release-notes/release-notes.md")
          if [[ "$CHANNEL" == "prerelease" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

      - name: Release summary
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          {
            echo "## 发布完成"
            echo
            echo "- 版本：$TAG"
            echo "- 渠道：$CHANNEL"
            echo "- 代码：$GITHUB_SHA"
            echo "- 验证任务：通过"
            echo "- GitHub Release：已创建"
            echo "注意：本流程不会修改 version.json 或切换网页正式版本。"
          } >> "$GITHUB_STEP_SUMMARY"

name: formal-release

# 正式发布入口：仅允许从 main 手动触发。
# 发布前会重新运行完整代码审计；版本号必须有对应 CHANGELOG 章节。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 5.6.0 或 5.6.0-rc.1（不带 v）"
        required: true
        type: string
      channel:
        description: "发布渠道"
        required: true
        type: choice
        options:
          - stable
          - prerelease

permissions:
  contents: write

concurrency:
  group: formal-release
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release input and changelog
        id: release
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta|rc)\.[0-9]+))?$ ]]; then
            echo "版本号格式不正确：$VERSION"
            echo "示例：5.6.0、5.6.0-beta.1、5.6.0-rc.1"
            exit 1
          fi

          if [[ "$CHANNEL" == "stable" && "$VERSION" == *-* ]]; then
            echo "Stable 正式版不能带 alpha/beta/rc 后缀"
            exit 1
          fi
          if [[ "$CHANNEL" == "prerelease" && "$VERSION" != *-* ]]; then
            echo "预发布版本必须带 alpha/beta/rc 后缀"
            exit 1
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "版本标签已存在：$TAG"
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 {
              rest = substr($0, length(heading) + 1)
              if (rest == "" || rest ~ /^[[:space:]]/) {
                found = 1
                next
              }
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "CHANGELOG 对应版本章节为空，拒绝发布"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "已通过版本号、渠道、标签和更新日志检查。"

      - name: Static code audit
        run: node .github/scripts/code_audit.js

      - name: Cat game migration security audit
        run: node .github/scripts/cat_game_migration_check.js

      - name: Cat game work-order behaviour check
        run: node .github/scripts/cat_work_order_check.js

      - name: Cat game database behaviour checks (local PGlite only)
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund @electric-sql/pglite@0.6.0
          node .github/scripts/cat_game_pg_check.mjs .

      - name: Timer regression tests
        run: node .github/scripts/timer_check.js v5.5.html

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          ARGS=("$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES_FILE")
          if [[ "$CHANNEL" == "prerelease" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

      - name: Release summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          {
            echo "## 发布完成"
            echo
            echo "- 版本：`$TAG`"
            echo "- 渠道：`$CHANNEL`"
            echo "- 代码：`$GITHUB_SHA`"
            echo "- 完整审计：通过"
            echo
            echo "注意：本流程创建 Git 标签和 GitHub Release；不会修改 version.json，也不会单独触发网页版本号切换。"
          } >> "$GITHUB_STEP_SUMMARY"

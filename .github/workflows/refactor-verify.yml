name: refactor-verify

on:
  push:
    branches: [test-refactor-verify]
  pull_request:
    branches: [test-refactor-verify]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refactor-verify-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export generated lockfile for repository commit
        run: |
          echo 'LOCKFILE_BASE64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'LOCKFILE_BASE64_END'
      - name: Run AST and automation tests
        run: npm test

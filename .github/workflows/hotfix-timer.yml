name: hotfix-timer-resume

on:
  push:
    paths:
      - .github/workflows/hotfix-timer.yml

permissions:
  contents: write

concurrency:
  group: hotfix-timer
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch resume drift guard and visibility self-heal
        run: |
          set -e
          python3 - <<'PYFIX'
          import io

          p = 'v5.1.html'
          s = io.open(p, encoding='utf-8').read()

          g_old = "var suspicious=delta>MAX_AUTO_GAP||(reason==='resume'&&drift>CLOCK_DRIFT_LIMIT)||(reason==='tick'&&drift>CLOCK_DRIFT_LIMIT);"
          g_new = "var suspicious=delta>MAX_AUTO_GAP||(reason==='tick'&&drift>CLOCK_DRIFT_LIMIT);"
          t_old = "setInterval(function(){if(!visible)return;if(data.session&&!data.session.pendingReview)accrue(Date.now(),'tick');draw()},1000);"
          t_new = "setInterval(function(){if(document.hidden){if(visible)onHide();return}if(!visible)onShow();if(data.session&&!data.session.pendingReview)accrue(Date.now(),'tick');draw()},1000);"

          if g_old in s and t_old in s:
              assert s.count(g_old) == 1 and s.count(t_old) == 1
              s = s.replace(g_old, g_new).replace(t_old, t_new)
              io.open(p, 'w', encoding='utf-8').write(s)
              print('hotfix applied')
          elif g_new in s and t_new in s:
              print('already patched, skip')
          else:
              raise SystemExit('unexpected state: neither old nor new lines found')
          PYFIX
          grep -q "reason==='tick'&&drift>CLOCK_DRIFT_LIMIT" v5.1.html
          ! grep -q "reason==='resume'&&drift>CLOCK_DRIFT_LIMIT" v5.1.html
          grep -q "if(document.hidden){if(visible)onHide();return" v5.1.html
          echo "check ok"

      - name: Commit and push
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "hotfix: 锁屏恢复不再误判时钟异常，计时可见性自愈"
          git push

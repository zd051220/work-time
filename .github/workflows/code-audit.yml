name: code-audit

on:
  push:
    branches: ["**"]
    paths:
      - "*.html"
      - "js/**"
      - "**.md"
      - "version.json"
      - "docs/**"
      - "supabase/migrations/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Automatic versioning tests
        run: node --test .github/scripts/versioning*.test.cjs
      - name: Automatic changelog tests
        run: node --test .github/scripts/changelog.test.cjs
      - name: Isolated changelog E2E fixture generation
        run: node .github/scripts/changelog-e2e-test.cjs
      - name: Runtime version configuration validation
        run: node .github/scripts/versioning.cjs check-config version.json
      - name: Static code audit
        run: node .github/scripts/code_audit.js
      - name: Cat game migration security audit
        run: node .github/scripts/cat_game_migration_check.js
      - name: Cat game work-order behaviour check
        run: node .github/scripts/cat_work_order_check.js
      - name: Cat game database behaviour checks (PGlite)
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund @electric-sql/pglite@0.6.0 playwright@1.56.1
          node .github/scripts/cat_game_pg_check.mjs .
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Real browser compatibility tests
        run: node .github/scripts/browser-compat.playwright.cjs
      - name: Four-cat timer companion tests
        run: node --test .github/scripts/four-cat-companion.test.cjs
      - name: Timer regression tests (formal)
        run: node .github/scripts/timer_check.js v5.5.html

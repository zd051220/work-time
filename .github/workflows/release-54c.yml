name: release-54c
on:
  push:
permissions:
  contents: write
concurrency:
  group: release-54c
  cancel-in-progress: false
jobs:
  pub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          set -euo pipefail
          curl -sSL "https://aka.doubaocdn.com/s/bDAypeWReI" -o index.html
      - name: verify
        run: |
          set -euo pipefail
          echo "ae5bd54d6a7105b29f4c7a42539100a0283103aecbbd489a2e3db20d39eda14d  index.html" | sha256sum -c -
          echo "d2b96294e27774b1a48b8eec1cfcbe648fc2894b94e177aaad6480e74d6bc614  v5.4.html" | sha256sum -c -
          echo "b251e32349677b89773a230cce5ae4eab86fa23f4e0b45e3334fe89e9de863c2  version.json" | sha256sum -c -
          echo "3fe0f942296c303603dfbb181c52ff314117dbffd6d37089020b2a783f3c0e8e  v5.3.html" | sha256sum -c -
          echo "56a0dd5a84addc560a1807727f6cef22a89c0fbda9f47ad1cc77b88472a2b621  ledger.html" | sha256sum -c -
          echo "5.4 与 5.3 文件均未动，只换入口"
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/release-54c.yml
          git commit -m "入口切到 5.4（用户确认后）；5.3 与 ledger 保留"
          git push

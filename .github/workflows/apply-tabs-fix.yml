name: apply-tabs-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-tabs-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 修过就跳过
        id: guard
        run: |
          if grep -q 'mwPick53' v5.1.html; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 修底栏高亮
        if: steps.guard.outputs.skip == 'false'
        run: python3 .github/scripts/patch_tabs.py v5.1.html

      - name: 提交并推送
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "fix: 底栏高亮与内容对齐（按实际滚动位置判定）"
          git push

      - name: 自删本一次性工作流
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ -f .github/workflows/apply-tabs-fix.yml ]; then
            git rm .github/workflows/apply-tabs-fix.yml
            git commit -m "chore: 移除一次性 apply-tabs-fix 工作流"
            git push
          fi

name: fix53-audit

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix53-audit
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 修复并自检（结果写进 ci-report.txt）
        run: |
          set +e
          {
            echo "== 仓库当前哈希"
            sha256sum v5.3.html ledger.html v5.2.html
            echo "== 下载修复版"
            curl -sSL --retry 3 -o /tmp/a.html "https://aka.doubaocdn.com/s/VbXN7btyep"; echo "curl_v53=$?"
            curl -sSL --retry 3 -o /tmp/b.html "https://aka.doubaocdn.com/s/LV98XOGrx3"; echo "curl_ledger=$?"
            curl -sSL --retry 3 -o /tmp/c.html "https://aka.doubaocdn.com/s/A7SLBMYGU7"; echo "curl_v52=$?"
            sha256sum /tmp/a.html /tmp/b.html /tmp/c.html
            echo "== 验收：下载文件必须匹配"
            echo "80117f2705f658d2f321f2912d9a78337aba58b21eac99e5d7b41b35505607cf  /tmp/a.html" | sha256sum -c -
            echo "56a0dd5a84addc560a1807727f6cef22a89c0fbda9f47ad1cc77b88472a2b621  /tmp/b.html" | sha256sum -c -
            echo "a18fad485907e88e7de69a9c7ba4be91058b01559f4d5198f982faec6ad90e77  /tmp/c.html" | sha256sum -c -
            echo "verify_exit=$?"
            cp /tmp/a.html v5.3.html
            cp /tmp/b.html ledger.html
            cp /tmp/c.html v5.2.html
            echo "== 装载后哈希"
            sha256sum v5.3.html ledger.html v5.2.html
            echo "== 计时自检"
            TZ=Asia/Shanghai node .github/scripts/timer_check.js v5.3.html
            echo "timer_exit=$?"
            echo "== 语法抽查（关键新函数是否在位）"
            grep -c "mwMerge" v5.3.html
            grep -c "mwArbitrate" v5.3.html
            grep -c "mwFix53" v5.3.html
            grep -c "MW-FIX53-APPLIED" ledger.html
          } > ci-report.txt 2>&1
          cat ci-report.txt

      - name: 提交结果（不管成没成功都留报告）
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add v5.3.html ledger.html v5.2.html ci-report.txt
          if git diff --cached --quiet; then echo "没有变化"; else git commit -m "fix(5.3): 稳定性修复 + 自检报告"; git push; fi

      - name: 自删本工作流
        if: always()
        run: |
          git rm .github/workflows/fix53-audit.yml
          git commit -m "chore: 移除一次性 fix53-audit 工作流"
          git push

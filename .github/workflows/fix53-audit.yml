name: fix53-audit

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix53-audit
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 取回并验收 v5.3
        run: |
          set +e
          {
            echo "== 仓库当前"
            sha256sum v5.3.html
            echo "== 下载"
            curl -sSL --retry 3 -o /tmp/a.html "https://aka.doubaocdn.com/s/fUKfUzteHa"; echo "curl=$?"
            sha256sum /tmp/a.html
            echo "3fe0f942296c303603dfbb181c52ff314117dbffd6d37089020b2a783f3c0e8e  /tmp/a.html" | sha256sum -c -
            cp /tmp/a.html v5.3.html
            echo "== 计时自检"
            TZ=Asia/Shanghai node .github/scripts/timer_check.js v5.3.html
            echo "timer_exit=$?"
            echo "== 关键函数"
            grep -c "mwPullDisk" v5.3.html
            grep -c "mwMerge" v5.3.html
          } > ci-report.txt 2>&1
          cat ci-report.txt

      - name: 提交
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add v5.3.html ci-report.txt
          if git diff --cached --quiet; then echo "没有变化"; else git commit -m "fix(5.3): 只读页实时对齐记录列表（账本删除/新记录不用刷新）"; git push; fi

      - name: 自删本工作流
        if: always()
        run: |
          git rm .github/workflows/fix53-audit.yml || true
          git commit -m "chore: 移除一次性 fix53 工作流" || true
          git push || true

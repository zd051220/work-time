name: apply-urgent-notice

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-urgent-notice
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 已插入过就跳过
        id: guard
        run: |
          if grep -q 'URGENT_BEGIN' v5.1.html; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v5.1.html 已有紧急公告，跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 插入紧急计时公告
        if: steps.guard.outputs.skip == 'false'
        run: python3 .github/scripts/patch_notice.py v5.1.html

      - name: 提交前跑计时自检
        if: steps.guard.outputs.skip == 'false'
        env:
          TZ: Asia/Shanghai
        run: node .github/scripts/timer_check.js v5.1.html

      - name: 提交并推送
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "notice: 插入紧急计时规则公告（15:12 自动移除）"
          git push

      - name: 自删本一次性工作流
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ -f .github/workflows/apply-notice.yml ]; then
            git rm .github/workflows/apply-notice.yml
            git commit -m "chore: 移除一次性 apply-urgent-notice 工作流"
            git push
          fi

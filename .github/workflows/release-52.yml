name: release-5.2

on:
  schedule:
    - cron: '12 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-5.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if already released
        id: check
        run: |
          if [ -f xiaomao-banjin-5.2.html ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build 5.2
        if: steps.check.outputs.skip == 'false'
        run: python3 .github/scripts/release_52.py

      - name: Add game beta page and entry link
        if: steps.check.outputs.skip == 'false'
        env:
          GAME_WRAPPER_B64: ""
        run: |
          echo "$GAME_WRAPPER_B64" | base64 -d > game-beta.html
          if ! grep -q "game-beta.html" index.html; then
            sed -i 's|</main>|<div style="margin-top:14px"><a href="game-beta.html" style="display:inline-block;font-size:12px;font-weight:900;color:#7a5723;text-decoration:none;background:#fff6e2;border:1px solid #f0dcae;border-radius:12px;padding:10px 16px">猫猫游戏 · 测试版 ›</a></div></main>|' index.html
          fi

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "release 5.2: 删除墓碑 + 计时归属 + PWA + 猫猫游戏测试版"
          git push

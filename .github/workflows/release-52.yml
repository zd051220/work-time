name: release-5.2

on:
  schedule:
    - cron: '12 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-5.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if already released
        id: check
        run: |
          if [ -f xiaomao-banjin-5.2.html ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build 5.2
        if: steps.check.outputs.skip == 'false'
        run: python3 .github/scripts/release_52.py

      - name: Add game easter egg to 5.2
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 - <<'PYEGG'
          import io
          p = 'xiaomao-banjin-5.2.html'
          s = io.open(p, encoding='utf-8').read()
          if 'game-beta.html' not in s:
              egg = ('<div style="text-align:center;margin:2px 0 16px">'
                     '<a href="game-beta.html" style="font-size:10px;color:#ddd0bb;text-decoration:none">'
                     '🐾 听说这儿藏了只猫…</a></div>')
              anchor = '<section class="card" id="sec-account">'
              assert s.count(anchor) == 1, 'anchor not unique'
              s = s.replace(anchor, egg + '\n' + anchor)
              io.open(p, 'w', encoding='utf-8').write(s)
              print('easter egg inserted')
          else:
              print('easter egg already present')
          PYEGG

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "release 5.2: 删除墓碑 + 计时归属 + PWA + 猫猫游戏彩蛋"
          git push

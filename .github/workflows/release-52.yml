name: release-5.2

on:
  schedule:
    - cron: '12 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-5.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if already released
        id: check
        run: |
          if [ -f v5.2.html ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build 5.2
        if: steps.check.outputs.skip == 'false'
        run: python3 .github/scripts/release_52.py

      - name: 计时自检（失败则阻断发布）
        if: steps.check.outputs.skip == 'false'
        env:
          TZ: Asia/Shanghai
        run: node .github/scripts/timer_check.js v5.2.html

      - name: Game easter egg and link rewrite
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 - <<'PYEGG'
          import io

          def read(p):
              return io.open(p, encoding='utf-8').read()

          def write(p, s):
              io.open(p, 'w', encoding='utf-8').write(s)

          p = 'v5.2.html'
          s = read(p)
          anchor = '<section class="card" id="sec-account">'
          if 'cat-game-beta.html' not in s:
              egg = ('<div style="text-align:center;margin:2px 0 16px">'
                     '<a href="cat-game-beta.html" style="font-size:10px;color:#ddd0bb;text-decoration:none">'
                     '🐾 听说这儿藏了只猫…</a></div>')
              assert s.count(anchor) == 1, 'anchor not unique'
              write(p, s.replace(anchor, egg + '\n' + anchor))
              print('5.2: 彩蛋已插入 -> cat-game-beta.html')
          else:
              print('5.2: 彩蛋已存在')

          i = read('index.html')
          i = i.replace('xiaomao-banjin-5.2.html', 'v5.2.html')
          i = i.replace('xiaomao-banjin-5.1.html', 'v5.1.html')
          write('index.html', i)
          assert 'xiaomao-banjin-5.' not in read('index.html'), 'index 仍有旧名'
          print('index: 链接已指向新文件名')
          PYEGG

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "release 5.2: 删除墓碑 + 计时归属 + PWA + 猫猫游戏彩蛋"
          git push

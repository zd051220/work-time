name: release-5.2

on:
  schedule:
    - cron: '12 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-5.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if already released
        id: check
        run: |
          if [ -f xiaomao-banjin-5.2.html ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build 5.2
        if: steps.check.outputs.skip == 'false'
        run: python3 .github/scripts/release_52.py

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "xiaomao-release"
          git config user.email "zd051220@163.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "release 5.2: 删除墓碑 + 计时归属 + PWA 上线页"
          git push

name: automatic-changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: automatic-changelog-main
  cancel-in-progress: false

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Chinese changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/changelog.cjs CHANGELOG.md
      - name: Commit generated changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog from merged PRs"
          git push origin HEAD:main

name: automatic-changelog

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      test_mode:
        description: "仅运行隔离的端到端测试，不更新正式 CHANGELOG"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feat/changelog-e2e-test-mode
    paths:
      - .github/workflows/automatic-changelog.yml

permissions: {}

concurrency:
  group: automatic-changelog-main
  cancel-in-progress: false

jobs:
  update-changelog:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changelog.outputs.changed }}
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: work-time
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Chinese changelog
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/changelog.cjs CHANGELOG.md
      - name: Prepare bot branch
        id: changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/changelog
          git add CHANGELOG.md
          git commit -m "docs: update changelog from merged PRs"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push bot branch only
        if: steps.changelog.outputs.changed == 'true'
        run: |
          if git ls-remote --exit-code --heads origin automation/changelog >/dev/null 2>&1; then
            git fetch origin refs/heads/automation/changelog:refs/remotes/origin/automation/changelog
            expected="$(git rev-parse refs/remotes/origin/automation/changelog)"
            git push --force-with-lease="refs/heads/automation/changelog:${expected}" origin HEAD:refs/heads/automation/changelog
          else
            git push origin HEAD:refs/heads/automation/changelog
          fi
      - name: Create or update changelog pull request
        if: steps.changelog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          existing_pr="$(gh pr list --state open --base main --head automation/changelog --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create --base main --head automation/changelog \
              --title "docs: update generated Chinese changelog" \
              --body "由自动更新日志工作流生成。请检查自动生成区块；人工维护内容和历史版本章节不会被覆盖。此 PR 不修改 version.json，不创建 Tag 或 Release。"
          else
            echo "Updated existing changelog PR #${existing_pr}."
          fi

  isolated-e2e-generate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.test_mode == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/changelog-e2e-test-mode' && contains(github.event.head_commit.message, '[run-changelog-e2e]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Checkout isolated E2E fixture source without credentials
        uses: actions/checkout@v4
        with:
          ref: feat/changelog-e2e-test-mode
          path: e2e-source
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate isolated test CHANGELOG
        run: node e2e-source/.github/scripts/changelog-e2e-test.cjs
      - name: Validate and stage fixture artifact
        run: |
          set -euo pipefail
          for directory in docs docs/release docs/release/e2e-test; do
            test -d "$directory"
            test ! -L "$directory"
          done
          target="docs/release/e2e-test/CHANGELOG.test.md"
          test -f "$target"
          test ! -L "$target"
          size="$(wc -c < "$target")"
          if [ "$size" -gt 1048576 ]; then
            echo "Isolated fixture exceeds the 1 MiB safety limit."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/changelog-e2e-artifact"
          cp -- "$target" "$RUNNER_TEMP/changelog-e2e-artifact/CHANGELOG.test.md"
      - name: Upload only the isolated fixture file
        uses: actions/upload-artifact@v4
        with:
          name: changelog-e2e-fixture
          path: ${{ runner.temp }}/changelog-e2e-artifact/CHANGELOG.test.md
          if-no-files-found: error
          retention-days: 1

  isolated-e2e-publish:
    needs: isolated-e2e-generate
    if: needs.isolated-e2e-generate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Download isolated fixture artifact
        uses: actions/download-artifact@v4
        with:
          name: changelog-e2e-fixture
          path: generated-output
      - name: Validate artifact and stage the exact allowed file
        run: |
          set -euo pipefail
          test -d generated-output
          test ! -L generated-output
          unexpected="$(find generated-output -mindepth 1 ! -type f -print)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-file artifact entries:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          files="$(find generated-output -type f -printf '%P\n')"
          if [ "$files" != "CHANGELOG.test.md" ]; then
            echo "Artifact must contain exactly CHANGELOG.test.md."
            exit 1
          fi
          test ! -L generated-output/CHANGELOG.test.md
          size="$(wc -c < generated-output/CHANGELOG.test.md)"
          if [ "$size" -gt 1048576 ]; then
            echo "Isolated fixture exceeds the 1 MiB safety limit."
            exit 1
          fi
          mkdir -p docs/release/e2e-test
          install -m 0644 generated-output/CHANGELOG.test.md docs/release/e2e-test/CHANGELOG.test.md
      - name: Prepare dedicated test bot branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/changelog-e2e-test
          git add docs/release/e2e-test/CHANGELOG.test.md
          changed_files="$(git diff --cached --name-only)"
          if [ "$changed_files" != "docs/release/e2e-test/CHANGELOG.test.md" ]; then
            echo "Unexpected files staged for isolated test PR:"
            printf '%s\n' "$changed_files"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "The isolated fixture has no diff from main; refusing to create an empty test PR."
            exit 1
          fi
          git commit -m "test: exercise isolated changelog automation"
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: work-time
          permission-contents: write
          permission-pull-requests: write

      - name: Push dedicated test branch with step-scoped credentials
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          auth_header="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          if git ls-remote --exit-code --heads origin automation/changelog-e2e-test >/dev/null 2>&1; then
            git fetch origin refs/heads/automation/changelog-e2e-test:refs/remotes/origin/automation/changelog-e2e-test
            expected="$(git rev-parse refs/remotes/origin/automation/changelog-e2e-test)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push --force-with-lease="refs/heads/automation/changelog-e2e-test:${expected}" origin HEAD:refs/heads/automation/changelog-e2e-test
          else
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push origin HEAD:refs/heads/automation/changelog-e2e-test
          fi
          if git config --local --get-regexp '^http\..*extraheader$' >/dev/null 2>&1; then
            echo "Unexpected persisted Git authentication configuration."
            exit 1
          fi
      - name: Create or keep isolated test PR as Draft
        id: test-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --state open --base main --head automation/changelog-e2e-test --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create --draft --base main --head automation/changelog-e2e-test \
              --title "test: isolated automatic changelog end-to-end test" \
              --body "这是隔离测试 PR。只新增 docs/release/e2e-test/CHANGELOG.test.md，不修改正式 CHANGELOG.md、version.json，不创建 Tag/Release。请勿合并。"
            existing_pr="$(gh pr list --state open --base main --head automation/changelog-e2e-test --json number --jq '.[0].number')"
          else
            is_draft="$(gh pr view "$existing_pr" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              gh pr ready "$existing_pr" --undo
            fi
          fi
          is_draft="$(gh pr view "$existing_pr" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "Isolated test PR #${existing_pr} is not Draft; refusing to continue."
            exit 1
          fi
          base="$(gh pr view "$existing_pr" --json baseRefName --jq '.baseRefName')"
          head="$(gh pr view "$existing_pr" --json headRefName --jq '.headRefName')"
          if [ "$base" != "main" ] || [ "$head" != "automation/changelog-e2e-test" ]; then
            echo "Isolated test PR has an unexpected base or head branch."
            exit 1
          fi
          echo "number=$existing_pr" >> "$GITHUB_OUTPUT"
      - name: Wait for native PR audit on the exact test PR commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.test-pr.outputs.number }}"
          head_sha="$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')"
          check_count=0
          for attempt in $(seq 1 60); do
            check_count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" --jq '.total_count')"
            if [ "$check_count" -gt 0 ]; then
              break
            fi
            echo "Waiting for GitHub to register native checks for ${head_sha} (attempt ${attempt}/60)."
            sleep 10
          done
          if [ "$check_count" -eq 0 ]; then
            echo "No native checks were registered for the exact test PR commit within 10 minutes."
            exit 1
          fi
          gh pr checks "$pr_number" --watch --interval 10

*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:linear-gradient(145deg,#fff8eb,#f5e4c4);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#553b25}.wrap{max-width:680px;margin:auto}.head{text-align:center;margin:10px 0 22px}.head h1{font-size:25px;margin:0 0 7px}.head p{font-size:13px;color:#987b58}.panel{background:#fffdf8;border:1px solid #efdfc4;border-radius:26px;padding:20px;box-shadow:0 15px 40px #76552a12}.stage{display:flex;align-items:center;gap:14px;min-height:150px;padding:12px 18px;border-radius:20px;background:linear-gradient(120deg,#fff2d5,#fff9ec)}.cat{width:104px;height:104px;flex:0 0 104px;display:grid;place-items:center;position:relative;cursor:pointer;touch-action:manipulation;user-select:none;filter:drop-shadow(0 7px 5px #8e632322)}.cat-art{display:none;width:112px;height:104px;overflow:visible;transform-origin:50% 84%}.cat-variant-0 .cat-art-0,.cat-variant-1 .cat-art-1,.cat-variant-2 .cat-art-2,.cat-variant-3 .cat-art-3{display:block}.gold-bar{transform-origin:50% 50%}.cat.cat-work .cat-art{animation:mw-cat-haul .62s ease-in-out infinite}.cat.cat-work .gold-bar{animation:mw-gold-haul .62s ease-in-out infinite}.cat.cat-work .cat-tail{animation:mw-tail 1s ease-in-out infinite;transform-origin:40px 85px}.cat.cat-paid .cat-art{animation:mw-cat-rest 2.2s ease-in-out infinite}.cat.cat-unpaid .cat-art{animation:mw-cat-sleep 3.2s ease-in-out infinite}.cat.cat-unpaid .gold-bar{transform:translateY(7px) rotate(-8deg)}.cat.cat-off .cat-art{animation:mw-cat-cheer .72s ease-in-out infinite}.cat.cat-petted .cat-art{animation:mw-cat-pet .42s ease-in-out 3}.cat.cat-idle .cat-art{animation:mw-cat-idle 2.8s ease-in-out infinite}.cat.cat-idle .cat-tail{animation:mw-tail 1.8s ease-in-out infinite;transform-origin:40px 85px}@keyframes mw-cat-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes mw-cat-haul{0%,100%{transform:translateY(1px) rotate(-2deg)}50%{transform:translateY(-5 const cat=document.getElementById('cat'),line=document.getElementById('catLine'),buttons=[...document.querySelectorAll('button[data-mode]')];let variant=Math.floor(Math.random()*4);function setMode(m){cat.className='cat cat-'+m+' cat-variant-'+variant;const t={idle:['喵！准备好一起搬金条了吗？','等待开工，我先摇摇尾巴。'],work:['搬金条时间！我来啦。','小爪子抱紧金条，认真开工！'],paid:['休息一下也很重要。','抱着金条晒晒太阳，工资还在涨。'],unpaid:['呼……让我趴一会儿。','金条先当枕头，工资暂时暂停啦。'],off:['下班啦！今天辛苦了！','任务完成，抱着金条开心庆祝！'],petted:['呼噜呼噜！好舒服呀。','摸摸头，再给你一个小拥抱。']};line.innerHTML=t[m][0]+'<small>'+t[m][1]+'</small>';buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===m))}buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));cat.addEventListener('click',()=>setMode('petted'));cat.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setMode('petted')}});setMode('idle');

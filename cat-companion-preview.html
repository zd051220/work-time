<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小猫搬金条｜四形态互动预览</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:linear-gradient(145deg,#fff8eb,#f5e4c4);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#553b25}.wrap{max-width:680px;margin:auto}.head{text-align:center;margin:10px 0 22px}.head h1{font-size:25px;margin:0 0 7px}.head p{font-size:13px;color:#987b58}.panel{background:#fffdf8;border:1px solid #efdfc4;border-radius:26px;padding:20px;box-shadow:0 15px 40px #76552a12}.stage{display:flex;align-items:center;gap:14px;min-height:150px;padding:12px 18px;border-radius:20px;background:linear-gradient(120deg,#fff2d5,#fff9ec)}.cat{width:116px;height:116px;flex:0 0 116px;display:grid;place-items:center;position:relative;cursor:pointer;touch-action:manipulation;user-select:none;filter:drop-shadow(0 7px 5px #8e632322)}.cat-art{display:none;width:132px;height:132px;object-fit:contain;overflow:visible;transform-origin:50% 84%;pointer-events:none}.cat-variant-0 .cat-art-0,.cat-variant-1 .cat-art-1,.cat-variant-2 .cat-art-2,.cat-variant-3 .cat-art-3{display:block}.gold-bar{position:absolute;left:50%;bottom:8px;margin-left:-22px;width:44px;height:27px;transform-origin:50% 50%;filter:drop-shadow(0 2px 1px #80501455);pointer-events:none}.cat.cat-work .cat-art{animation:mw-cat-haul .62s ease-in-out infinite}.cat.cat-work .gold-bar{animation:mw-gold-haul .62s ease-in-out infinite}.cat.cat-work .cat-tail{animation:mw-tail 1s ease-in-out infinite;transform-origin:40px 85px}.cat.cat-paid .cat-art{animation:mw-cat-rest 2.2s ease-in-out infinite}.cat.cat-unpaid .cat-art{animation:mw-cat-sleep 3.2s ease-in-out infinite}.cat.cat-unpaid .gold-bar{transform:translateY(7px) rotate(-8deg)}.cat.cat-off .cat-art{animation:mw-cat-cheer .72s ease-in-out infinite}.cat.cat-petted .cat-art{animation:mw-cat-pet .42s ease-in-out 3}.cat.cat-idle .cat-art{animation:mw-cat-idle 2.8s ease-in-out infinite}.cat.cat-idle .cat-tail{animation:mw-tail 1.8s ease-in-out infinite;transform-origin:40px 85px}@keyframes mw-cat-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes mw-cat-haul{0%,100%{transform:translateY(1px) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}@keyframes mw-gold-haul{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes mw-tail{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(13deg)}}@keyframes mw-cat-rest{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(3px) rotate(1deg)}}@keyframes mw-cat-sleep{0%,100%{transform:translateY(3px) scale(.97)}50%{transform:translateY(5px) scale(.95)}}@keyframes mw-cat-cheer{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-12px) rotate(-5deg)}70%{transform:translateY(-5px) rotate(5deg)}}@keyframes mw-cat-pet{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.09) rotate(5deg)}}.bubble{font-size:17px;font-weight:850;line-height:1.55}.bubble small{display:block;font-size:12px;color:#92734b;font-weight:550;margin-top:6px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.controls button{border:1px solid #ead8bb;border-radius:13px;background:#fffaf0;color:#6b4b2d;padding:12px 8px;font-size:14px;font-weight:700;cursor:pointer}.controls button.active{background:#f4dfb7;border-color:#d8b46f}.foot{text-align:center;color:#a38b70;font-size:12px;margin:15px 0 0}@media(max-width:390px){.panel{padding:13px}.stage{gap:7px;padding:8px}.cat{width:88px;height:88px;flex-basis:88px}.cat-art{width:96px;height:96px}.bubble{font-size:14px}}@media(prefers-reduced-motion:reduce){.cat-art,.cat-tail,.gold-bar{animation:none!important}}
</style></head><body><main class="wrap"><header class="head"><h1>小猫搬金条</h1><p>四种不同外形 · 工作状态联动 · 长方体金条</p></header><section class="panel"><div class="stage"><div class="cat cat-idle cat-variant-0" id="cat" role="button" tabindex="0" aria-label="摸摸小猫" title="点一下摸摸小猫">
<img class="cat-art cat-art-0" data-role="soft-bell" data-state="idle" src="assets/cats/states/soft-bell/idle@512.png" alt="" draggable="false" loading="eager">
<img class="cat-art cat-art-1" data-role="sport-headband" data-state="idle" src="assets/cats/states/sport-headband/idle@512.png" alt="" draggable="false" loading="eager">
<img class="cat-art cat-art-2" data-role="sleepy-nightcap" data-state="idle" src="assets/cats/states/sleepy-nightcap/idle@512.png" alt="" draggable="false" loading="eager">
<img class="cat-art cat-art-3" data-role="leader-crown" data-state="idle" src="assets/cats/states/leader-crown/idle@512.png" alt="" draggable="false" loading="eager"></div><div class="bubble" id="catLine">喵！准备好一起搬金条了吗？<small>点击下方按钮切换计时状态，也可以摸摸猫咪。</small></div></div><div class="controls"><button data-mode="idle" class="active">未开工</button><button data-mode="work">开始上班</button><button data-mode="paid">带薪休息</button><button data-mode="unpaid">不带薪休息</button><button data-mode="off">下班庆祝</button><button data-mode="petted">摸摸猫咪</button></div><div class="controls" id="variants"><button data-variant="0" class="active">白猫·铃铛</button><button data-variant="1">运动猫·红领巾</button><button data-variant="2">睡帽猫</button><button data-variant="3">队长猫·金冠</button></div><p class="foot">这是独立交互预览，不连接工资、打卡或账本数据。</p></section></main><script>
const ROLES=['soft-bell','sport-headband','sleepy-nightcap','leader-crown'],STATES=['idle','work','paid','unpaid','off','interaction'];
const cat=document.getElementById('cat'),line=document.getElementById('catLine'),buttons=[...document.querySelectorAll('button[data-mode]')],variantButtons=[...document.querySelectorAll('button[data-variant]')];let variant=Math.floor(Math.random()*4),mode='idle';
function artState(m){return m==='petted'?'interaction':m;}
function paint(){const img=cat.querySelector('.cat-art-'+variant),state=artState(mode);if(!img)return;const path='assets/cats/states/'+ROLES[variant]+'/'+state+'@512.png';img.dataset.state=state;if(img.getAttribute('src')!==path)img.src=path;}
function setMode(m){mode=m;cat.className='cat cat-'+m+' cat-variant-'+variant;const t={idle:['喵！准备好一起搬金条了吗？','等待开工，我先摇摇尾巴。'],work:['搬金条时间！我来啦。','小爪子抱紧金条，认真开工！'],paid:['休息一下也很重要。','抱着金条晒晒太阳，工资还在涨。'],unpaid:['呼……让我趴一会儿。','金条先当枕头，工资暂时暂停啦。'],off:['下班啦！今天辛苦了！','任务完成，抱着金条开心庆祝！'],petted:['呼噜呼噜！好舒服呀。','摸摸头，再给你一个小拥抱。']};line.innerHTML=t[m][0]+'<small>'+t[m][1]+'</small>';buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===m));paint();}
buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
variantButtons.forEach(b=>b.addEventListener('click',()=>{variant=Number(b.dataset.variant);variantButtons.forEach(x=>x.classList.toggle('active',x===b));paint();}));
cat.addEventListener('click',()=>setMode('petted'));cat.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setMode('petted')}});
variantButtons.forEach(x=>x.classList.toggle('active',Number(x.dataset.variant)===variant));setMode('idle');
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e8"><title>小猫搬金条 · 2D动态猫咪预览</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px 40px;background:linear-gradient(145deg,#fff8eb,#f9edda);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#553b25}
main{max-width:620px;margin:0 auto}.top{text-align:center;margin:10px 0 22px}.top h1{font-size:25px;margin:0 0 8px}.top p{margin:0;color:#92775b;font-size:14px}.panel{background:#fffdf8;border:1px solid #f0dfc5;border-radius:24px;padding:24px 18px;box-shadow:0 12px 35px #76552a12}
.stage{display:flex;align-items:center;gap:18px;min-height:160px;padding:18px;border-radius:18px;background:linear-gradient(120deg,#fff3d8,#fff9ee)}
.cat{width:112px;height:112px;flex:0 0 112px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.cat-art{width:140px;height:112px;overflow:visible;transform-origin:50% 80%}.cat:focus-visible{outline:3px solid #d99b35;outline-offset:3px;border-radius:18px}
.cat.cat-idle .cat-art{animation:kitten-idle 2.8s ease-in-out infinite}.cat.cat-idle #catTail,.cat.cat-paid #catTail{transform-origin:38px 70px;animation:kitten-tail 1.4s ease-in-out infinite}
.cat.cat-work .cat-art{animation:kitten-carry .65s ease-in-out infinite}.cat.cat-work #goldProp{opacity:1;animation:kitten-gold .65s ease-in-out infinite;transform-origin:122px 93px}
.cat.cat-paid .cat-art{animation:kitten-happy 1.8s ease-in-out infinite}.cat.cat-paid #happyMarks{opacity:1;animation:kitten-spark 1.3s ease-in-out infinite}
.cat.cat-unpaid .cat-art{animation:kitten-sleep 3s ease-in-out infinite}.cat.cat-unpaid #closedEyes{opacity:1}.cat.cat-unpaid #catHead{transform:translateY(7px) rotate(-5deg);transform-origin:90px 70px}.cat.cat-unpaid #sleepMarks{opacity:1;animation:kitten-zzz 2s ease-in-out infinite}
.cat.cat-petted .cat-art{animation:kitten-pet .55s ease-in-out 2}.cat.cat-petted #closedEyes{opacity:1}.cat.cat-petted #happyMarks{opacity:1}
.cat.cat-walk .cat-art{animation:kitten-walk .45s ease-in-out infinite}.cat.cat-walk #legBack{transform-origin:54px 89px;animation:kitten-leg .45s ease-in-out infinite alternate}.cat.cat-walk #legFront{transform-origin:88px 89px;animation:kitten-leg .45s ease-in-out infinite alternate-reverse}
@keyframes kitten-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes kitten-tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}@keyframes kitten-carry{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}@keyframes kitten-gold{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(5deg)}}@keyframes kitten-happy{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.025)}}@keyframes kitten-spark{0%,100%{opacity:.35}50%{opacity:1}}@keyframes kitten-sleep{0%,100%{transform:translateY(1px) scale(.98)}50%{transform:translateY(3px) scale(.96)}}@keyframes kitten-zzz{0%,100%{opacity:.3;transform:translateY(3px)}50%{opacity:1;transform:translateY(-3px)}}@keyframes kitten-pet{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.08) rotate(-6deg)}70%{transform:scale(1.06) rotate(6deg)}}@keyframes kitten-walk{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}@keyframes kitten-leg{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@media(max-width:380px){body{padding:15px 12px 28px}.panel{padding:17px 13px}.stage{gap:10px;padding:12px}.cat{width:92px;height:92px;flex-basis:92px}.cat-art{width:116px;height:92px}.bubble{font-size:15px}.bubble small{font-size:12px}}
@media(prefers-reduced-motion:reduce){.cat,.cat-art,.cat #catTail,.cat #goldProp,.cat #sleepMarks,.cat #happyMarks,.cat #legBack,.cat #legFront{animation:none!important;transition:none!important}}
.bubble{font-size:17px;font-weight:700;line-height:1.55}.bubble small{display:block;font-size:13px;font-weight:400;color:#9a8063;margin-top:5px}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.controls button{border:1px solid #ead8bb;border-radius:13px;background:#fffaf0;color:#6b4b2d;padding:13px 10px;font-size:14px;font-weight:650;cursor:pointer}.controls button.active{background:#f4dfb7;border-color:#d8b46f}.hint{text-align:center;color:#a38b70;font-size:12px;margin:16px 0 0}
</style></head><body><main><header class="top"><h1>小猫搬金条 · 动态猫咪</h1><p>这次是完整绘制的 2D 小猫，不是 Emoji</p></header><section class="panel"><div class="stage"><div class="cat cat-idle" id="cat" role="button" tabindex="0" aria-label="摸摸小猫" title="点一下摸摸小猫"><svg class="cat-art" viewBox="0 0 160 120" role="img" aria-label="白色卡通小猫">
<g id="catTail" fill="none" stroke="#413d39" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M37 78 C14 77 9 59 16 42 C21 31 31 37 31 49 C30 62 39 63 48 65"/></g>
<g id="catLegs" fill="#fff" stroke="#413d39" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
<path id="legBack" d="M49 83 Q39 91 40 105 Q42 113 54 111 L65 108 L68 88Z"/>
<path id="legFront" d="M91 82 Q102 91 99 106 Q97 114 86 112 L77 108 L76 88Z"/>
</g>
<path id="catBody" d="M35 72 Q36 55 56 54 Q70 45 93 55 Q111 60 116 78 Q119 98 102 104 Q80 110 53 103 Q33 99 35 72Z" fill="#fff" stroke="#413d39" stroke-width="7" stroke-linejoin="round"/>
<g id="catHead">
<path d="M47 54 L48 20 Q49 9 60 18 L76 31 Q88 25 100 29 L116 15 Q126 8 129 22 L132 54 Q135 77 112 83 Q83 93 58 79 Q43 71 47 54Z" fill="#fff" stroke="#413d39" stroke-width="7" stroke-linejoin="round"/>
<path d="M56 25 L59 43 L72 34Z M113 34 L124 23 L125 46Z" fill="#f5bfc4"/>
<ellipse cx="70" cy="58" rx="5.5" ry="8" fill="#353535"/><ellipse cx="108" cy="58" rx="5.5" ry="8" fill="#353535"/>
<circle cx="72" cy="55" r="1.8" fill="#fff"/><circle cx="110" cy="55" r="1.8" fill="#fff"/>
<ellipse cx="58" cy="70" rx="8" ry="4.5" fill="#f7c7c5" opacity=".8"/><ellipse cx="119" cy="70" rx="8" ry="4.5" fill="#f7c7c5" opacity=".8"/>
<path d="M84 67 Q89 72 94 67 Q92 78 87 76 Q83 74 84 67Z" fill="#e88e93" stroke="#413d39" stroke-width="2.5"/>
<path id="closedEyes" d="M62 59 Q69 66 76 59 M100 59 Q107 66 114 59" fill="none" stroke="#413d39" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
</g>
<g id="goldProp" opacity="0"><path d="M106 84 Q121 75 137 84 L133 101 Q120 109 107 100Z" fill="#f5bd32" stroke="#9c681d" stroke-width="3"/><path d="M110 85 Q121 79 133 85 Q122 92 110 85Z" fill="#ffe38b" stroke="#9c681d" stroke-width="2"/><path d="M117 91 L127 91" stroke="#fff4c4" stroke-width="2" stroke-linecap="round"/></g>
<g id="sleepMarks" opacity="0" fill="#8d7ba4" font-family="sans-serif" font-weight="900"><text x="121" y="23" font-size="16">z</text><text x="135" y="12" font-size="12">z</text></g>
<g id="happyMarks" opacity="0" fill="#e9a52d"><path d="M132 37 l7 -10 l3 2 l-6 11Z M141 49 l13 -3 l1 4 l-13 3Z"/></g>
</svg></div><div class="bubble" id="line">喵！我在这里陪你。<small>可以切换动作，也可以点小猫摸摸它。</small></div></div><div class="controls"><button class="active" data-mode="idle">待机 · 眨眼摇尾巴</button><button data-mode="walk">走动 · 小步移动</button><button data-mode="work">工作 · 搬金条</button><button data-mode="paid">开心 · 摸摸回应</button><button data-mode="unpaid">睡觉 · 打盹</button></div><p class="hint">独立预览页，不连接正式工资、打卡或云端数据。</p></section></main>
<script>
const cat=document.getElementById('cat'),line=document.getElementById('line'),buttons=[...document.querySelectorAll('button[data-mode]')];
const states={idle:['喵！我在这里陪你。','眨眨眼睛，尾巴轻轻摇。'],walk:['哒哒哒！我走过来啦。','腿部交替摆动，身体跟着移动。'],work:['搬呀搬呀！金条正在增加！','小猫抱着金元宝，一下一下搬。'],paid:['嘿嘿！被你摸到啦。','开心地举起小爪子回应。'],unpaid:['呼……我先睡一小会儿。','闭上眼睛，慢慢打起小呼噜。']};
function setMode(mode){cat.className='cat cat-'+mode;line.innerHTML=states[mode][0]+'<small>'+states[mode][1]+'</small>';buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
function pet(){cat.className='cat cat-petted';line.textContent='呼噜呼噜！被你摸到啦～';setTimeout(()=>{const active=buttons.find(b=>b.classList.contains('active'));setMode(active?active.dataset.mode:'idle')},1200)}
cat.addEventListener('click',pet);cat.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pet()}});
</script></body></html>

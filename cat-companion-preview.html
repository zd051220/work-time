<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7e8">
<title>小猫搬金条 · 动态猫咪预览</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px 40px;background:linear-gradient(145deg,#fff8eb,#f9edda);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#553b25}
main{max-width:620px;margin:0 auto}.top{text-align:center;margin:10px 0 22px}.top h1{font-size:25px;margin:0 0 8px}.top p{margin:0;color:#92775b;font-size:14px}
.panel{background:#fffdf8;border:1px solid #f0dfc5;border-radius:24px;padding:24px 18px;box-shadow:0 12px 35px #76552a12}
.stage{display:flex;align-items:center;gap:18px;min-height:145px;padding:18px;border-radius:18px;background:linear-gradient(120deg,#fff3d8,#fff9ee)}
.cat{position:relative;display:grid;place-items:center;flex:0 0 92px;width:92px;height:92px;font-size:62px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;transform-origin:50% 78%;will-change:transform}
.cat:focus-visible{outline:3px solid #d99b35;outline-offset:3px;border-radius:18px}
.cat.cat-idle{animation:cat-idle 2.8s ease-in-out infinite}.cat.cat-work{animation:cat-carry .72s ease-in-out infinite}.cat.cat-paid{animation:cat-purr 1.8s ease-in-out infinite}.cat.cat-unpaid{animation:cat-sleep 3.2s ease-in-out infinite}.cat.cat-petted{animation:cat-petted .62s cubic-bezier(.2,.8,.2,1) 2}
.cat.cat-work:after{content:"🪙";position:absolute;right:-5px;bottom:2px;font-size:24px;animation:cat-gold .72s ease-in-out infinite}.cat.cat-unpaid:after{content:"z z";position:absolute;right:-8px;top:2px;font-size:13px;font-weight:900;color:#987b9f;letter-spacing:1px;animation:cat-zzz 2.4s ease-in-out infinite}.cat.cat-paid:after{content:"♡";position:absolute;right:-4px;top:0;font-size:20px;color:#df8f91;animation:cat-heart 1.8s ease-in-out infinite}
.bubble{font-size:17px;font-weight:700;line-height:1.55}.bubble small{display:block;font-size:13px;font-weight:400;color:#9a8063;margin-top:5px}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.controls button{border:1px solid #ead8bb;border-radius:13px;background:#fffaf0;color:#6b4b2d;padding:13px 10px;font-size:14px;font-weight:650;cursor:pointer}.controls button.active{background:#f4dfb7;border-color:#d8b46f}.hint{text-align:center;color:#a38b70;font-size:12px;margin:16px 0 0}
@keyframes cat-idle{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-2px) rotate(3deg)}}
@keyframes cat-carry{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(3px,-4px) rotate(3deg)}}@keyframes cat-purr{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.035)}}@keyframes cat-sleep{0%,100%{transform:translateY(1px) rotate(-2deg) scale(.98)}50%{transform:translateY(3px) rotate(2deg) scale(.96)}}@keyframes cat-petted{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.13) rotate(-9deg)}70%{transform:scale(1.08) rotate(9deg)}}@keyframes cat-gold{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-5px) rotate(8deg)}}@keyframes cat-zzz{0%,100%{opacity:.35;transform:translate(0,3px)}50%{opacity:1;transform:translate(3px,-4px)}}@keyframes cat-heart{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@media(max-width:380px){body{padding:15px 12px 28px}.panel{padding:17px 13px}.stage{gap:10px;padding:12px}.cat{flex-basis:72px;width:72px;height:72px;font-size:49px}.bubble{font-size:15px}.bubble small{font-size:12px}}
@media(prefers-reduced-motion:reduce){.cat,.cat:before,.cat:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main>
<header class="top"><h1>🐈 小猫搬金条</h1><p>动态猫咪效果预览 · 试着点点小猫</p></header>
<section class="panel">
<div class="stage"><div class="cat cat-idle" id="cat" role="button" tabindex="0" aria-label="摸摸小猫">🐈</div><div class="bubble" id="line">喵！准备好开工了吗？<small>待机时会轻轻晃动，点一下摸摸它。</small></div></div>
<div class="controls" aria-label="切换猫咪状态">
<button class="active" data-mode="idle">待机 · 轻轻晃动</button><button data-mode="work">工作 · 搬金条</button><button data-mode="paid">带薪休息 · 呼噜</button><button data-mode="unpaid">摸鱼 · 睡觉</button>
</div><p class="hint">这是独立演示页，不连接正式工资、打卡或云端数据。</p>
</section></main>
<script>
const cat=document.getElementById('cat'),line=document.getElementById('line'),buttons=[...document.querySelectorAll('button[data-mode]')];
const states={idle:['🐈','喵！准备好开工了吗？','待机时轻轻晃动。'],work:['🐈‍⬛','搬呀搬呀！金条正在增加！','工作状态会有搬运动作和金币。'],paid:['😺','正在享受带薪休息～','小猫开心地呼噜呼噜。'],unpaid:['😴','小猫正在休息充电～','不带薪休息时就睡一会儿。']};
function setMode(mode){const s=states[mode];cat.className='cat cat-'+mode;cat.textContent=s[0];line.innerHTML=s[1]+'<small>'+s[2]+'</small>';buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
function pet(){cat.classList.remove('cat-petted');void cat.offsetWidth;cat.classList.add('cat-petted');line.textContent='呼噜呼噜！被你摸到啦～';setTimeout(()=>{cat.classList.remove('cat-petted');const active=buttons.find(b=>b.classList.contains('active'));setMode(active?active.dataset.mode:'idle')},1350)}
cat.addEventListener('click',pet);cat.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pet()}});
</script></body></html>

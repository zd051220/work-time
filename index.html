<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3d6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>小猫搬金条 v5.5</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff1d2,#fffaf2 45%,#f8f1e8);color:#49382c;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding:22px 20px 30px}
.box{max-width:360px;margin:0 auto;text-align:center}.tag{display:inline-block;font-size:11px;font-weight:900;color:#8a6a2c;background:#fff4d9;border:1px solid #f0dcae;border-radius:999px;padding:5px 12px;letter-spacing:.5px}
.cat{font-size:50px;line-height:1;margin:16px 0 8px}h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.5px}.sub{font-size:11px;color:#a6917a;margin-top:6px;line-height:1.6}
.go{display:block;margin-top:18px;font-size:14px;font-weight:900;color:#5b3f12;text-decoration:none;background:linear-gradient(#f9d780,#e9ae3f);padding:15px;border-radius:16px;box-shadow:0 4px 0 #d49b35}.auto{font-size:11px;color:#a6917a;margin-top:10px}
.pwa{font-size:11px;color:#a6917a;line-height:1.7;margin-top:18px;background:#fffdf8;border:1px dashed #eddfc8;border-radius:12px;padding:10px 12px}
</style></head>
<body><main class="box">
<div class="tag">v5.5 正式版</div><div class="cat">🐈</div><h1>小猫搬金条</h1>
<div class="sub">工作计时、工资账本与猫咪养成</div>
<a class="go" href="v5.5.html">进入小猫搬金条 ›</a>
<div class="auto" id="auto">正在为你打开正式版…</div>
<div class="pwa">添加到手机桌面：iPhone 使用 Safari 分享 →「添加到主屏幕」；Android 使用 Chrome 菜单 →「安装应用」或「添加到主屏幕」。</div>
</main><script>(function(){
  var done=false;
  function go(path,version){
    if(done)return;done=true;
    try{
      var target=new URL(path,location.href);
      if(target.origin!==location.origin||!/^https?:$/.test(target.protocol))throw new Error('invalid update url');
      if(version)target.searchParams.set('release',version);
      location.replace(target.href);
    }catch(e){location.replace('v5.5.html')}
  }
  var fallback=setTimeout(function(){go('v5.5.html','5.5')},1800);
  fetch('version.json?check='+Date.now(),{cache:'no-store',credentials:'same-origin'})
    .then(function(r){if(!r.ok)throw new Error('version unavailable');return r.json()})
    .then(function(info){
      if(!info||typeof info.url!=='string'||typeof info.version!=='string')throw new Error('invalid version metadata');
      clearTimeout(fallback);go(info.url,info.version);
    }).catch(function(){clearTimeout(fallback);go('v5.5.html','5.5')});
})();</script></body></html>

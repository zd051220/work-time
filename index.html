<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3d9">
<title>小猫搬金条 5.2 · 新版预告</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff1d2,#fffaf2 45%,#f8f1e8);color:#49382c;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding:22px 20px 30px}
.box{max-width:360px;margin:0 auto;text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:900;color:#8a6a2c;background:#fff4d9;border:1px solid #f0dcae;
  border-radius:999px;padding:5px 12px;letter-spacing:.5px}
.cat{font-size:50px;line-height:1;margin:16px 0 8px}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.5px}
.h1sub{font-size:11px;color:#a6917a;margin-top:6px;line-height:1.6}
.count{margin:16px 0 4px;font-size:26px;font-weight:900;color:#c8862a;font-variant-numeric:tabular-nums}
.rel{font-size:11px;color:#9b8877;line-height:1.7}
ul{text-align:left;margin:16px 0 0;padding:14px 16px;background:#fffdf8;border:1px solid #f1e3cc;border-radius:14px;
  box-shadow:0 2px 10px #c9a76a1a;list-style:none}
li{font-size:12px;line-height:1.75;color:#5a4835;margin:0 0 8px}
li:last-child{margin-bottom:0}
li b{color:#3f2f20}
.go{display:block;margin-top:16px;font-size:14px;font-weight:900;color:#5b3f12;text-decoration:none;
  background:linear-gradient(#f9d780,#e9ae3f);padding:15px;border-radius:16px;box-shadow:0 4px 0 #d49b35}
.go:active{transform:translateY(1px);box-shadow:0 3px 0 #d49b35}
.auto{font-size:11px;color:#b09a80;margin-top:10px}
.tip{font-size:10px;color:#b5a38d;margin-top:12px;line-height:1.9}
.tip a{color:#a37f47;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main class="box">
  <div class="tag">5.2 新版预告</div>
  <div class="cat">🐈</div>
  <h1>小猫搬金条 5.2</h1>
  <div class="h1sub">这次主要修后端：删掉的记录不会再自己跑回来</div>
  <div class="count" id="cd">正在计算…</div>
  <div class="rel" id="rel">预计今天 15:12 上线，到点刷新就是新版</div>
  <ul>
    <li><b>删了不会复活</b>：删除记录会留一个「删除标记」，换手机或用账本页同步时，不会再把它从云端拉回来。</li>
    <li><b>计时归属本机</b>：正在计时的打卡绑在当前设备上，别的设备登录只看不接管，不会悄悄覆盖你的计时。</li>
    <li><b>账本页同步一致</b>：账本页删除同样写删除标记，两个页面不再互相打架。</li>
  </ul>
  <a class="go" href="v5.1.html">先进入 5.1 用着 ›</a>
  <div class="auto" id="auto">6 秒后自动进入 5.1</div>
  <div class="tip">账本页 <a href="ledger.html">ledger.html</a> · <a href="v5.1.html">直接进入</a></div>
</main>
<script>
(function(){
var REL=1795504363000;
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  var d=REL-Date.now(),cd=document.getElementById('cd'),rel=document.getElementById('rel');
  if(d<=0){cd.textContent='正在上线';rel.textContent='5.2 已到上线时间，刷新一下页面就是新版';return}
  var s=Math.floor(d/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  cd.textContent='还有 '+pad(h)+':'+pad(m)+':'+pad(x);
}
tick();setInterval(tick,1000);
var left=6,au=document.getElementById('auto');
var t=setInterval(function(){
  left--;au.textContent=left+' 秒后自动进入 5.1';
  if(left<=0){clearInterval(t);location.replace('v5.1.html')}
},1000);
})();
</script>
</body>
</html>
